.stats-month-end strong{font-size:13px}.stats-month-end b{font-size:19px}.stats-month-end small{grid-column:1/-1;color:var(--sub);font-size:11px}
.stats-route-compare{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px;align-items:center;padding:7px 0;border-bottom:1px solid #355e88}
.stats-route-compare span{font-size:12px}.stats-route-compare span small{font-size:10px;color:var(--sub)}.stats-route-compare strong{font-size:13px}
.stats-route-compare>small{grid-column:1/-1;font-size:11px;color:var(--sub)}
@media(max-width:400px){.stats-day-trip{grid-template-columns:minmax(0,1fr) auto;gap:3px 8px}.stats-day-trip small{grid-column:1/-1;text-align:left}}


.stats-record-line{display:grid;grid-template-columns:minmax(0,1fr) minmax(105px,35%);gap:7px;margin:6px 0;align-items:stretch}
.stats-record-main,.stats-record-diff{border:1px solid #4b78a9;border-radius:10px;padding:8px 9px;background:#204675;min-width:0}
.stats-record-main{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;align-items:center}
.stats-record-main strong{font-size:12px;overflow-wrap:anywhere}
.stats-record-main b{font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}
.stats-record-main small{grid-column:1/-1;font-size:10px;color:var(--sub)}
.stats-record-diff{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:3px}
.stats-record-diff strong{font-size:16px;font-variant-numeric:tabular-nums}
.stats-record-diff small{font-size:9px;color:var(--sub);line-height:1.2}
.stats-record-diff.good{border-color:#3e9d82;background:#164e49;color:#b5f7df}
.stats-record-diff.late{border-color:#a88053;background:#56412e;color:#ffdbaf}
@media(max-width:390px){.stats-record-line{grid-template-columns:minmax(0,1fr) 105px;gap:5px}.stats-record-main,.stats-record-diff{padding:7px}.stats-record-main{grid-template-columns:1fr}.stats-record-main b{font-size:14px}}


/* Monthly route-first statistics */
.stats-route-card{padding:0;overflow:hidden}
.stats-route-head{list-style:none;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto 16px;gap:9px;align-items:center;padding:13px}
.stats-route-head::-webkit-details-marker{display:none}
.stats-route-head:focus-visible{outline:3px solid #8dc3ff;outline-offset:-3px}
.stats-route-name,.stats-route-best{display:flex;flex-direction:column;gap:4px;min-width:0}
.stats-route-name strong{font-size:16px;overflow-wrap:anywhere}
.stats-route-name small{font-size:11px;color:var(--sub)}
.stats-route-best{text-align:right;white-space:nowrap}
.stats-route-best small{font-size:10px;color:var(--sub)}
.stats-route-best b{font-size:19px;font-variant-numeric:tabular-nums}
.stats-route-details[open]>.stats-route-head>.compact-stat-chevron{transform:rotate(180deg)}
.stats-route-body{border-top:1px solid var(--edge);padding:10px;background:#123252}
.stats-route-mini{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-bottom:9px}
.stats-route-mini span{display:flex;flex-direction:column;align-items:center;gap:4px;background:#1d4778;border:1px solid #416c9b;border-radius:9px;padding:8px 3px}
.stats-route-mini small{font-size:10px;color:var(--sub);text-align:center}
.stats-route-mini b{font-size:15px;white-space:nowrap}
.stats-driver-entry{border:1px solid #426f9e;border-radius:11px;background:#1b426f;overflow:hidden;margin-top:7px}
.stats-driver-entry .stats-driver-head{padding:10px}
.stats-driver-entry .stats-driver-body{padding:9px}
.stats-driver-entry .stats-driver-average small{max-width:135px;text-align:right;white-space:normal}
.stats-driver-compact{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--sub)}
.stats-driver-compact b{color:#fff}
.stats-driver-entry .stats-comparison{font-size:11px;padding:6px 0}
.stats-driver-entry .stats-record-line{margin:5px 0}
.stats-driver-entry .stats-record-main{grid-template-columns:minmax(0,1fr) auto}
.stats-driver-entry .stats-month-end{margin-top:9px}
@media(max-width:390px){.stats-route-head{padding:11px;gap:6px}.stats-route-best b{font-size:17px}.stats-driver-entry .stats-driver-head{gap:5px}.stats-driver-entry .stats-driver-average b{font-size:17px}}

</style></head>
<body><div id="scroll"><div class="wrap">
<header><div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h11v10H3zM14 10h4l3 4v2h-7z"/><circle cx="7.5" cy="18" r="2"/><circle cx="18" cy="18" r="2"/></svg></div><h1>Δρομολόγια</h1></header>
<main id="main" aria-live="polite"><div class="empty">Σύνδεση με τη βάση δεδομένων…</div></main>

</div></div>
<nav class="bottom-nav" aria-label="Κύρια πλοήγηση">
<button type="button" data-tab="today" class="active"><span>⌂</span>Σήμερα</button>
<button type="button" data-tab="history"><span>◷</span>Ιστορικό</button>
<button type="button" data-tab="stats"><span>▥</span>Στατιστικά</button>
<button type="button" data-tab="drivers"><span>♙</span>Οδηγοί</button>
<button type="button" data-tab="leaves"><span>▦</span>Άδειες</button>
</nav>
<div id="toast" class="status hidden" role="status"></div>
<dialog id="editDialog"><h2>Διόρθωση ή διαγραφή</h2><form id="editForm">
<label class="field">Οδηγός<select id="editDriver" required></select></label>
<label class="field">Αναχώρηση (ώρα Ελλάδας)<input type="datetime-local" id="editStart" required></label>
<label class="field">Άφιξη (προαιρετικό)<input type="datetime-local" id="editEnd"></label>
<label class="field">Αιτιολογία αλλαγής<textarea id="editReason" maxlength="500" required placeholder="Π.χ. καθυστερημένη καταχώριση"></textarea></label>
<div class="buttons"><button type="button" class="btn secondary" data-do="close-edit">Ακύρωση</button><button type="button" class="btn" data-do="save-edit">Αποθήκευση</button></div>
<button type="button" class="btn warn" data-do="remove-run">Διαγραφή καταχώρισης</button>
<p class="note">Όλες οι διορθώσεις καταγράφονται στο ιστορικό αλλαγών.</p>
</form></dialog>
<script>
"use strict";
const $=id=>document.getElementById(id);
let state={routes:[],drivers:[],today:[],stats:[],routeStats:[],todayDate:""};
let tab="today",busy=false,editing=null,historyRows=[],historyLoaded=false;
let histFrom="",histTo="",routeFilter="",driverFilter="",statRoute="A",historyFiltersOpen=false;


let statsHistory=[],statsRouteBests={},statsHistoryReady=false,statsHistoryLoading=false,statsHistoryAt=0,statsOpenRoute="",statsOpenDriver="";
let statsMonth=new Intl.DateTimeFormat("sv-SE",{timeZone:"Europe/Athens",year:"numeric",month:"2-digit"}).format(new Date()).slice(0,7);
const statsMonthLabel=ym=>new Intl.DateTimeFormat("el-GR",{month:"long",year:"numeric",timeZone:"UTC"}).format(new Date(ym+"-15T12:00:00Z"));
const monthAdjacent=(month,delta)=>{const d=new Date(month+"-15T12:00:00Z");d.setUTCMonth(d.getUTCMonth()+delta);return d.toISOString().slice(0,7);};
const monthLast=month=>{const d=new Date(month+"-01T12:00:00Z");d.setUTCMonth(d.getUTCMonth()+1);d.setUTCDate(0);return d.toISOString().slice(0,10);};
async function fetchStatsMonth(month){
 const rows=[];let offset=0;
 while(true){
  const batch=await request("history",null,{from:month+"-01",to:monthLast(month),offset,limit:500});
  rows.push(...batch.rows);
  if(batch.rows.length<500)break;
  offset+=500;
  if(offset>25000)throw Error("Πάρα πολλές διαδρομές για φόρτωση.");
 }
 return rows;
}
async function loadStatsHistory(force=false){
 if(statsHistoryLoading)return;
 if(!force&&statsHistoryReady&&Date.now()-statsHistoryAt<300000)return;
 statsHistoryLoading=true;
 const month=statsMonth;
 try{
  const [current,baselineData]=await Promise.all([fetchStatsMonth(month),fetch("https://oikcdjnxkmgrpyedxera.supabase.co/functions/v1/douleia-route-baselines",{cache:"no-store"}).then(async r=>{if(!r.ok)throw Error("Δεν φορτώθηκε το ρεκόρ.");return r.json();})]);
  if(statsMonth!==month)return;
  statsHistory=current;statsRouteBests=Object.fromEntries((baselineData.routeBests||[]).map(b=>[b.route_code,b]));statsHistoryReady=true;statsHistoryAt=Date.now();
 }catch(e){statsHistoryReady=false;console.warn("Στατιστικά μήνα:",e);if(tab==="stats")toast("Δεν φορτώθηκαν τα μηνιαία στατιστικά.",true);}
 finally{statsHistoryLoading=false;if(tab==="stats")renderStats();}
}
function changeStatsMonth(delta){
 if(statsHistoryLoading)return;
 statsMonth=monthAdjacent(statsMonth,delta);
 statsHistoryReady=false;statsHistory=[];
 renderStats();loadStatsHistory(true);
}
const completedStatsRows=rows=>rows.filter(r=>r.arrival_at&&r.departure_at&&Number.isFinite(lengthSecs(r))&&lengthSecs(r)>0);
const statMean=rows=>rows.length?rows.reduce((sum,r)=>sum+lengthSecs(r),0)/rows.length:null;
const statMedian=rows=>{
 if(!rows.length)return null;
 const a=rows.map(lengthSecs).sort((a,b)=>a-b),k=Math.floor(a.length/2);
 return a.length%2?a[k]:(a[k-1]+a[k])/2;
};
const statWeekday=date=>new Intl.DateTimeFormat("el-GR",{weekday:"short",timeZone:"UTC"}).format(new Date(date+"T12:00:00Z"));
const statGap=(a,b)=>a==null||b==null?"—":(Math.abs(a-b)<30?"±0λ":(a>b?"+":"−")+Math.round(Math.abs(a-b)/60)+"λ");
const statCountWord=count=>count===1?"καταγραφή":"καταγραφές";

const apiBase="https://oikcdjnxkmgrpyedxera.supabase.co/functions/v1/dromologia/";
const safe=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const localDay=()=>new Intl.DateTimeFormat("sv-SE",{timeZone:"Europe/Athens",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date());
const dayLabel=s=>s?s.split("-").reverse().join("/"):"";
const isWorkday=s=>{const d=new Date(s+"T12:00:00Z").getUTCDay();return d!==0&&d!==6};
const clock=iso=>iso?new Intl.DateTimeFormat("el-GR",{timeZone:"Europe/Athens",hour:"2-digit",minute:"2-digit",hour12:false}).format(new Date(iso)):"—:—";
const lengthSecs=r=>r&&r.arrival_at?Math.max(0,Math.round((Date.parse(r.arrival_at)-Date.parse(r.departure_at))/1000)):null;
const duration=sec=>sec==null?"—":(Math.floor(sec/3600)>0?Math.floor(sec/3600)+"ώ ":"")+Math.floor((sec%3600)/60)+"λ";
const delta=sec=>sec==null?"—":(sec>0?"+":sec<0?"−":"±")+Math.round(Math.abs(sec)/60)+"λ";
const routeName=code=>state.routes.find(x=>x.code===code)?.name||code;
const driverName=id=>state.drivers.find(x=>x.id===id)?.name||"Άγνωστος";
const countSamples=(driver,route)=>state.stats.find(x=>x.driver_id===driver&&x.route_code===route);
const routeAvg=route=>state.routeStats.find(x=>x.route_code===route);
function toast(s,err=false){const x=$("toast");x.textContent=s;x.className="status"+(err?" error":"");clearTimeout(toast.timer);toast.timer=setTimeout(()=>x.className="status hidden",4500);}
async function request(action,body=null,params={}){const url=new URL(apiBase,location.href);url.searchParams.set("api",action);for(const [k,v] of Object.entries(params))url.searchParams.set(k,String(v));const opts={cache:"no-store"};if(body){opts.method="POST";opts.headers={"Content-Type":"application/json"};opts.body=JSON.stringify(body);}const r=await fetch(url,opts);let data;try{data=await r.json()}catch{throw Error("Δεν ήταν δυνατή η επικοινωνία με τον διακομιστή.");}if(!r.ok||data.error)throw Error(data.error||"Σφάλμα διακομιστή");return data;}
async function refresh(show=true){if(busy&&show)return;try{const result=await request("state");state=result;if(tab==="today"||tab==="stats"||tab==="drivers")render();if(show)toast("Τα δεδομένα ενημερώθηκαν.");}catch(e){toast(e.message,true);if(!state.routes.length)$("main").innerHTML='<div class="empty">Αδυναμία σύνδεσης. Έλεγξε το Internet και πάτησε επανάληψη.<div class="action-row"><button class="btn" data-do="refresh">Επανάληψη</button></div></div>';}}
async function doAction(action,body){if(busy)return;busy=true;document.querySelectorAll("button").forEach(b=>{if(b.dataset.do)b.disabled=true});try{await request(action,body);await refresh(false);if(tab==="history")await loadHistory();toast(action==="start"?"Η αναχώρηση καταχωρίστηκε.":action==="arrive"?"Η άφιξη καταχωρίστηκε.":"Η καταχώριση αποθηκεύτηκε και συγχρονίστηκε.");return true}catch(e){toast(e.message,true);return false}finally{busy=false;render();}}
function render(){document.querySelectorAll("[data-tab]").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));if(tab==="today")renderToday();else if(tab==="history")renderHistory();else if(tab==="stats")renderStats();else if(tab==="leaves")renderLeaves();else renderDrivers();}
function renderToday(){
 const done=state.today.filter(r=>!!r.arrival_at).length,open=state.today.filter(r=>!r.arrival_at).length;
 const day=state.todayDate||localDay(),work=isWorkday(day);
 let s='<h2>Σήμερα</h2><p class="meta">'+dayLabel(day)+' · '+open+' στον δρόμο · '+done+' ολοκληρώθηκαν</p>';
 if(!work)s+='<p class="empty">Σαββατοκύριακο — δεν υπάρχουν προγραμματισμένες αναχωρήσεις.</p>';
 s+='<div class="route-grid">';
 for(const r of state.routes){
  const rec=state.today.find(x=>x.route_code===r.code),status=rec?(rec.arrival_at?"done":"active"):"wait";
  const label=rec?(rec.arrival_at?"Ολοκληρώθηκε":"Στον δρόμο"):"Αναμονή";
  s+='<section class="card route-card is-'+status+'"><div class="route-top"><h3>'+safe(r.name)+'</h3><span class="tag '+status+'">'+label+'</span></div>';
  if(!rec){
   const drivers=state.drivers.filter(d=>d.is_active);
   s+='<p class="driver-instruction">Αναχώρηση · πάτησε τον οδηγό</p>';
   if(drivers.length){
    s+='<div class="driver-grid" role="group" aria-label="Επιλογή οδηγού για άμεση αναχώρηση στο '+safe(r.name)+'">'+drivers.map(d=>'<button type="button" class="driver-choice" data-do="start-driver" data-route="'+safe(r.code)+'" data-driver="'+safe(d.id)+'" aria-label="Αναχώρηση '+safe(r.name)+' με οδηγό '+safe(d.name)+'" '+(!work?"disabled":"")+'>'+safe(d.name)+'</button>').join("")+'</div>';
   }else{
    s+='<p class="route-hint">Δεν υπάρχουν ενεργοί οδηγοί. Πρόσθεσε οδηγό από την καρτέλα «Οδηγοί».</p>';
   }
   s+='<div class="route-buttons"><button class="btn secondary" disabled>Άφιξη</button></div>';
  }else{
   s+='<p class="driver-name">'+safe(driverName(rec.driver_id))+'</p>';
   if(!rec.arrival_at){
    s+='<p class="trip-line"><span>Αναχώρηση <b>'+clock(rec.departure_at)+'</b></span><span>Εκτίμηση <b>'+(rec.estimated_return_at?clock(rec.estimated_return_at):"—")+'</b></span></p>';
   }else{
    s+='<p class="trip-line"><span>'+clock(rec.departure_at)+' → '+clock(rec.arrival_at)+'</span><strong>'+duration(lengthSecs(rec))+'</strong></p>';
   }
   s+='<div class="route-buttons"><button class="btn secondary" disabled>Αναχώρηση ✓</button>';
   s+=rec.arrival_at?'<button class="btn secondary" disabled>Άφιξη ✓</button>':'<button class="btn" data-do="arrive" data-id="'+safe(rec.id)+'">Άφιξη</button>';
   s+='</div><div class="action-row"><button class="mini-btn" data-do="edit" data-id="'+safe(rec.id)+'">Διόρθωση / Διαγραφή</button></div>';
  }
  s+='</section>';
 }
 $("main").innerHTML=s+'</div>';
}


function renderStats(){
 const all=statsHistoryReady?completedStatsRows(statsHistory):[];
 let html='<h2>Στατιστικά</h2><div class="stats-month-nav"><button type="button" class="mini-btn" data-stats-month="-1" aria-label="Προηγούμενος μήνας">‹</button><strong>'+safe(statsMonthLabel(statsMonth))+'</strong><button type="button" class="mini-btn" data-stats-month="1" aria-label="Επόμενος μήνας">›</button></div>';
 if(!statsHistoryReady){
  html+='<div class="empty">'+(statsHistoryLoading?'Φόρτωση…':'Δεν υπάρχουν διαθέσιμα στοιχεία.')+'</div>';
  $("main").innerHTML=html;return;
 }
 html+='<div class="compact-stats-list">';
 for(const route of state.routes){
  const runs=all.filter(r=>r.route_code===route.code).sort((a,b)=>Date.parse(b.departure_at)-Date.parse(a.departure_at));
  const best=statsRouteBests[route.code]?.best_seconds??null;
  const count=statsRouteBests[route.code]?.completed_count??0;
  const ids=[...new Set(runs.map(r=>r.driver_id))].sort((a,b)=>driverName(a).localeCompare(driverName(b),"el"));
  html+='<section class="card stats-route-card"><details name="monthly-route" class="stats-route-details" data-route-code="'+safe(route.code)+'" '+(statsOpenRoute===route.code?'open':'')+'>';
  html+='<summary class="stats-route-head"><span class="stats-route-name"><strong>'+safe(route.name)+'</strong><small>'+runs.length+' '+statCountWord(runs.length)+' · Μ.Ο. '+duration(statMean(runs))+'</small></span><span class="stats-route-best"><small>Ρεκόρ</small><b>'+duration(best)+'</b></span><span class="compact-stat-chevron" aria-hidden="true">⌄</span></summary>';
  html+='<div class="stats-route-body">';
  if(!runs.length)html+='<p class="compact-stat-empty">Χωρίς καταγραφές αυτόν τον μήνα.</p>';
  else for(const id of ids){
   const driverRuns=runs.filter(r=>r.driver_id===id);
   const driverAvg=statMean(driverRuns);
   const driverKey=route.code+"|"+id;
   html+='<div class="stats-driver-entry"><details class="stats-driver-details" data-route-code="'+safe(route.code)+'" data-driver-id="'+safe(id)+'" '+(statsOpenDriver===driverKey?'open':'')+'>';
   html+='<summary class="stats-driver-head"><span class="stats-driver-name"><strong>'+safe(driverName(id))+'</strong><small>'+driverRuns.length+' '+statCountWord(driverRuns.length)+'</small></span><span class="stats-driver-average"><small>Μ.Ο.</small><b>'+duration(driverAvg)+'</b></span><span class="compact-stat-chevron" aria-hidden="true">⌄</span></summary>';
   html+='<div class="stats-driver-body">';
   for(const run of driverRuns){
    const actual=lengthSecs(run),diff=best==null?null:actual-best;
    const label=diff==null?"—":count===1?"Πρώτη φορά":diff===0?"Ρεκόρ":diff<60?"+&lt;1λ":"+"+Math.round(diff/60)+"λ";
    const color=diff==null?"":diff===0?"good":diff>=600?"late":"muted";
    html+='<div class="stats-record-line"><div class="stats-record-main"><strong>'+safe(statWeekday(run.service_date))+' '+dayLabel(run.service_date)+'</strong><b>'+duration(actual)+'</b></div><div class="stats-record-diff '+color+'"><strong>'+label+'</strong></div></div>';
   }
   html+='</div></details></div>';
  }
  html+='</div></details></section>';
 }
 if(!state.routes.length)html+='<div class="empty">Δεν υπάρχουν δρομολόγια.</div>';
 $("main").innerHTML=html+'</div>';
}

function renderHistory(){
 let s='<h2>Ιστορικό</h2><p class="meta">'+dayLabel(histFrom)+' – '+dayLabel(histTo)+'</p>';
 s+='<div class="action-row history-tools"><button class="btn secondary" data-do="toggle-filters" aria-expanded="'+historyFiltersOpen+'">'+(historyFiltersOpen?"Κλείσιμο φίλτρων":"Φίλτρα · Εξαγωγή CSV")+'</button></div>';
 if(historyFiltersOpen){
  s+='<div class="toolbar"><label class="field">Από<input type="date" id="histFrom" value="'+safe(histFrom)+'"></label><label class="field">Έως<input type="date" id="histTo" value="'+safe(histTo)+'"></label><label class="field">Δρομολόγιο<select id="histRoute"><option value="">Όλα</option>'+state.routes.map(r=>'<option value="'+safe(r.code)+'" '+(routeFilter===r.code?"selected":"")+'>'+safe(r.name)+'</option>').join("")+'</select></label><label class="field">Οδηγός<select id="histDriver"><option value="">Όλοι</option>'+state.drivers.map(d=>'<option value="'+safe(d.id)+'" '+(driverFilter===d.id?"selected":"")+'>'+safe(d.name)+'</option>').join("")+'</select></label><button class="btn" data-do="history-load">Αναζήτηση</button><button class="btn secondary" data-do="export">CSV</button></div>';
 }
 const f=historyRows.filter(x=>(!routeFilter||x.route_code===routeFilter)&&(!driverFilter||x.driver_id===driverFilter));
 let out=s+'<p class="meta">'+(historyLoaded?f.length+' καταχωρίσεις':'Φόρτωση ιστορικού…')+'</p><div class="stack history-list">';
 for(const rec of f){
  out+='<section class="card history-card"><div class="row"><strong>'+safe(routeName(rec.route_code))+'</strong><span class="tag '+(rec.arrival_at?"done":"active")+'">'+(rec.arrival_at?"Ολοκληρώθηκε":"Στον δρόμο")+'</span></div>';
  out+='<div class="sub">'+dayLabel(rec.service_date)+' · '+safe(driverName(rec.driver_id))+'</div><div class="row"><span>'+clock(rec.departure_at)+' → '+clock(rec.arrival_at)+'</span><span class="duration">'+duration(lengthSecs(rec))+'</span></div>';
  out+='<div class="action-row">'+(rec.arrival_at?'':'<button class="btn" data-do="arrive" data-id="'+safe(rec.id)+'">Άφιξη</button>')+'<button class="mini-btn" data-do="edit" data-id="'+safe(rec.id)+'">Διόρθωση / Διαγραφή</button></div></section>';
 }

async function loadHistory(){try{historyLoaded=false;renderHistory();historyRows=await getAllHistory(false);historyLoaded=true;renderHistory();}catch(e){historyLoaded=true;toast(e.message,true);renderHistory();}}
async function getAllHistory(forExport){let rows=[],offset=0;while(true){const batch=await request("history",null,{from:histFrom,to:histTo,offset,limit:500});rows=rows.concat(batch.rows);if(batch.rows.length<500)break;offset+=500;if(offset>25000)throw Error("Πολύ μεγάλο εύρος. Επίλεξε μικρότερο διάστημα.");}return rows;}
function toAthensLocal(iso){if(!iso)return "";const p=new Intl.DateTimeFormat("sv-SE",{timeZone:"Europe/Athens",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hour12:false}).format(new Date(iso));return p.replace(" ","T");}
function toUTC(local){if(!local)return null;const target=Date.parse(local+":00Z");if(!Number.isFinite(target))throw Error("Μη έγκυρη ημερομηνία.");let t=target;for(let i=0;i<4;i++){const p=toAthensLocal(new Date(t).toISOString());const actual=Date.parse(p+":00Z");t+=target-actual;}return new Date(t).toISOString();}
function editRun(id){editing=state.today.find(x=>x.id===id)||historyRows.find(x=>x.id===id);if(!editing)return toast("Δεν βρέθηκε το δρομολόγιο.",true);$("editDriver").innerHTML=state.drivers.map(d=>'<option value="'+safe(d.id)+'">'+safe(d.name)+'</option>').join("");$("editDriver").value=editing.driver_id;$("editStart").value=toAthensLocal(editing.departure_at);$("editEnd").value=toAthensLocal(editing.arrival_at);$("editReason").value="";$("editDialog").showModal();}
async function exportCsv(){const rows=await getAllHistory(true);const picked=rows.filter(x=>(!routeFilter||x.route_code===routeFilter)&&(!driverFilter||x.driver_id===driverFilter));const quote=s=>'"'+String(s??"").replace(/"/g,'""')+'"';const csv=[["Ημερομηνία","Δρομολόγιο","Οδηγός","Αναχώρηση","Άφιξη","Διάρκεια (λεπτά)","Εκτίμηση επιστροφής"].map(quote).join(";")];for(const r of picked)csv.push([r.service_date,routeName(r.route_code),driverName(r.driver_id),clock(r.departure_at),clock(r.arrival_at),lengthSecs(r)==null?"":Math.round(lengthSecs(r)/60),clock(r.estimated_return_at)].map(quote).join(";"));const blob=new Blob(["\uFEFF"+csv.join("\r\n")],{type:"text/csv;charset=utf-8"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="dromologia_"+histFrom+"_"+histTo+".csv";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000);toast("Εξαγωγή "+picked.length+" καταχωρίσεων.");}
document.addEventListener("change",e=>{if(e.target.id==="statRoute"){statRoute=e.target.value;renderStats();}if(e.target.id==="histFrom")histFrom=e.target.value;if(e.target.id==="histTo")histTo=e.target.value;if(e.target.id==="histRoute"){routeFilter=e.target.value;renderHistory();}if(e.target.id==="histDriver"){driverFilter=e.target.value;renderHistory();}});

if(act==="save-edit"){const reason=$("editReason").value.trim();if(reason.length<4)return toast("Συμπλήρωσε αιτιολογία (4 χαρακτήρες).",true);try{const p_departure=toUTC($("editStart").value),p_arrival=toUTC($("editEnd").value);if(!p_departure)throw Error("Συμπλήρωσε την αναχώρηση.");const ok=await doAction("correct",{p_run:editing.id,p_driver:$("editDriver").value,p_departure,p_arrival,p_reason:reason});if(ok){$("editDialog").close();if(tab==="history")await loadHistory();}}catch(err){toast(err.message,true);}return;}
if(act==="remove-run"){const reason=$("editReason").value.trim();if(reason.length<4)return toast("Συμπλήρωσε αιτιολογία διαγραφής.",true);if(!confirm("Να διαγραφεί η καταχώριση; Η ενέργεια καταγράφεται στο ιστορικό αλλαγών."))return;const ok=await doAction("remove",{p_run:editing.id,p_reason:reason});if(ok)$("editDialog").close();return;}
if(act==="toggle-filters"){historyFiltersOpen=!historyFiltersOpen;renderHistory();return;}
 if(act==="history-load"){if(histFrom>histTo)return toast("Η ημερομηνία Από πρέπει να προηγείται της Έως.",true);loadHistory();return;}
if(act==="export"){try{await exportCsv()}catch(err){toast(err.message,true)}return;}
if(act==="driver-add"){const name=prompt("Όνομα νέου οδηγού:");if(name===null)return;await doAction("driver",{p_id:null,p_name:name,p_active:true});return;}
if(act==="driver-rename"){const d=state.drivers.find(x=>x.id===id);if(!d)return;const name=prompt("Νέο όνομα οδηγού:",d.name);if(name===null)return;await doAction("driver",{p_id:id,p_name:name,p_active:d.is_active});return;}
if(act==="driver-toggle"){const d=state.drivers.find(x=>x.id===id);if(!d||!confirm((d.is_active?"Να απενεργοποιηθεί ":"Να ενεργοποιηθεί ")+d.name+";"))return;await doAction("driver",{p_id:id,p_name:d.name,p_active:!d.is_active});return;}
});

const leavesApi="https://oikcdjnxkmgrpyedxera.supabase.co/functions/v1/douleia-leaves";
let staffRecords=[],leaveRecords=[],leaveDate="",leaveReady=false,leaveChoice="",leaveKind="week",leaveBusy=false;
async function leaveRequest(action,fields={}) {
 const options=action?{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action,...fields})}:{method:"GET"};
 const response=await fetch(leavesApi,{...options,cache:"no-store"});
 const data=await response.json();
 if(!response.ok||data.error)throw Error(data.error||"Σφάλμα αποθήκευσης αδειών");
 return data;
}
async function loadLeaves() {
 try{
  const data=await leaveRequest();
  staffRecords=data.staff||[];leaveRecords=data.leaves||[];leaveDate=data.serverDate||localDay();leaveReady=true;
  if(tab==="leaves")renderLeaves();
 }catch(e){toast(e.message,true);if(tab==="leaves")$("main").innerHTML='<div class="empty">Αδυναμία φόρτωσης αδειών.<div class="action-row"><button class="btn" data-leave="reload">Επανάληψη</button></div></div>';}
}
const staffName=id=>staffRecords.find(p=>p.id===id)?.name||"Άγνωστος";
function renderLeaves(){
 if(!leaveReady){$("main").innerHTML='<div class="empty">Φόρτωση αδειών…</div>';return;}
 const active=staffRecords.filter(p=>p.active);
 const selected=active.find(p=>p.id===leaveChoice);
 const date=leaveDate||localDay();
 const ongoing=leaveRecords.filter(r=>r.start_date<=date&&r.end_date>=date);
 const mondayOffset=(new Date(date+"T12:00:00Z").getUTCDay()+6)%7;
 const weekFirst=new Date(date+"T12:00:00Z");weekFirst.setUTCDate(weekFirst.getUTCDate()-mondayOffset);
 if(weekFirst.getUTCDay()===6||weekFirst.getUTCDay()===0)weekFirst.setUTCDate(weekFirst.getUTCDate()+7);
 const first=weekFirst.toISOString().slice(0,10);
 const last=new Date(first+"T12:00:00Z");last.setUTCDate(last.getUTCDate()+4);
 let html='<h2>Άδειες προσωπικού</h2><p class="meta">Σήμερα '+dayLabel(date)+' · '+ongoing.length+' σε άδεια</p>';
 html+='<section class="card"><h3 style="text-align:center;margin:0 0 12px">Νέα άδεια</h3><p class="sub" style="text-align:center">Πάτησε το όνομα του εργαζομένου</p><div class="driver-grid">';
 html+=active.map(p=>'<button type="button" class="driver-choice'+(leaveChoice===p.id?' leave-selected':'')+'" data-leave="choose" data-id="'+safe(p.id)+'" aria-pressed="'+(leaveChoice===p.id)+'">'+safe(p.name)+'</button>').join("");
 html+='</div>';
 if(!active.length)html+='<p class="empty">Πρόσθεσε πρώτα εργαζομένους.</p>';
 html+='<p class="sub" style="text-align:center;margin-top:16px">Διάρκεια άδειας</p><div class="leave-kinds"><button class="btn '+(leaveKind==="week"?'':'secondary')+'" data-leave="kind" data-kind="week">5 ημέρες</button><button class="btn '+(leaveKind==="day"?'':'secondary')+'" data-leave="kind" data-kind="day">1 ημέρα</button></div>';
 html+='<p class="meta" style="margin-top:12px">'+(leaveKind==="week"?"Δευτέρα έως Παρασκευή · αυτόματη εβδομάδα":"Σήμερα · "+dayLabel(date))+'</p>';
 if(selected)html+='<button class="btn full" data-leave="save" '+(leaveBusy?'disabled':'')+'>Καταχώριση · '+safe(selected.name)+'</button>';
 html+='</section>';
 html+='<h2>Καταχωρισμένες άδειες</h2><div class="stack">';
 if(!leaveRecords.length)html+='<div class="empty">Δεν έχουν καταχωριστεί άδειες.</div>';
 for(const item of leaveRecords){
  const label=item.kind==="week"?"5 ημέρες":"1 ημέρα";
  html+='<section class="card history-card"><div class="row"><strong>'+safe(staffName(item.staff_id))+'</strong><span class="tag '+(item.start_date<=date&&item.end_date>=date?'done':'wait')+'">'+label+'</span></div><div class="sub">'+dayLabel(item.start_date)+(item.start_date!==item.end_date?' – '+dayLabel(item.end_date):'')+'</div><div class="action-row"><button class="mini-btn" data-leave="delete" data-id="'+safe(item.id)+'">Διαγραφή</button></div></section>';
 }
 html+='</div><h2>Προσωπικό</h2><section class="card"><button class="btn full" data-leave="add-staff">+ Νέος εργαζόμενος</button>';
 for(const p of staffRecords){html+='<div class="settings-person"><div class="identity"><strong>'+safe(p.name)+'</strong><div class="sub">'+(p.active?'Ενεργός':'Ανενεργός')+'</div></div><div class="actions"><button class="mini-btn" data-leave="toggle-staff" data-id="'+safe(p.id)+'" data-active="'+(!p.active)+'">'+(p.active?'Απενεργοποίηση':'Ενεργοποίηση')+'</button></div></div>';}
 html+='</section>';
 $("main").innerHTML=html;
}
document.addEventListener("click",async event=>{
 const nav=event.target.closest('[data-tab="leaves"]');
 if(nav){await loadLeaves();return;}
 const b=event.target.closest("[data-leave]");
 if(!b||leaveBusy)return;
 const act=b.dataset.leave;
 if(act==="choose"){leaveChoice=b.dataset.id;renderLeaves();return;}
 if(act==="kind"){leaveKind=b.dataset.kind;renderLeaves();return;}
 if(act==="reload"){await loadLeaves();return;}
 let action,fields;
 if(act==="save"){
  if(!leaveChoice)return toast("Επίλεξε εργαζόμενο.",true);
  if(!confirm("Καταχώριση "+(leaveKind==="week"?"5ήμερης":"μονοήμερης")+" άδειας για "+staffName(leaveChoice)+";"))return;
  action="addLeave";fields={staffId:leaveChoice,kind:leaveKind};
 }else if(act==="add-staff"){
  const name=prompt("Ονοματεπώνυμο εργαζομένου:");
  if(name===null)return;
  action="addStaff";fields={name};
 }else if(act==="toggle-staff"){
  if(!confirm("Αλλαγή κατάστασης εργαζομένου;"))return;
  action="toggleStaff";fields={id:b.dataset.id,active:b.dataset.active==="true"};
 }else if(act==="delete"){
  if(!confirm("Να διαγραφεί αυτή η άδεια;"))return;
  action="deleteLeave";fields={id:b.dataset.id};
 }else return;
 leaveBusy=true;
 try{await leaveRequest(action,fields);if(act==="save")leaveChoice="";await loadLeaves();toast("Η αλλαγή αποθηκεύτηκε και συγχρονίστηκε.");}
 catch(e){toast(e.message,true);}
 finally{leaveBusy=false;if(tab==="leaves")renderLeaves();}
});
