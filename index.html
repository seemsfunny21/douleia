<body><div id="scroll"><div class="wrap">
<header><div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h11v10H3zM14 10h4l3 4v2h-7z"/><circle cx="7.5" cy="18" r="2"/><circle cx="18" cy="18" r="2"/></svg></div><h1>Δρομολόγια</h1></header>
<main id="main" aria-live="polite"><div class="empty">Σύνδεση με τη βάση δεδομένων…</div></main>

</div></div>
<nav class="bottom-nav" aria-label="Κύρια πλοήγηση">
<button type="button" data-tab="today" class="active"><span>⌂</span>Σήμερα</button>
<button type="button" data-tab="history"><span>◷</span>Ιστορικό</button>
<button type="button" data-tab="stats"><span>▥</span>Στατιστικά</button>
<button type="button" data-tab="drivers"><span>♙</span>Οδηγοί</button>
</nav>
<div id="toast" class="status hidden" role="status"></div>
<dialog id="editDialog"><h2>Διόρθωση ή διαγραφή</h2><form id="editForm">
<label class="field">Οδηγός<select id="editDriver" required></select></label>
<label class="field">Αναχώρηση (ώρα Ελλάδας)<input type="datetime-local" id="editStart" required></label>
<label class="field">Άφιξη (προαιρετικό)<input type="datetime-local" id="editEnd"></label>
<label class="field">Αιτιολογία αλλαγής<textarea id="editReason" maxlength="500" required placeholder="Π.χ. καθυστερημένη καταχώριση"></textarea></label>
<div class="buttons"><button type="button" class="btn secondary" data-do="close-edit">Ακύρωση</button><button type="button" class="btn" data-do="save-edit">Αποθήκευση</button></div>
<button type="button" class="btn warn" data-do="remove-run">Διαγραφή καταχώρισης</button>
<p class="note">Όλες οι διορθώσεις καταγράφονται στο ιστορικό αλλαγών.</p>
</form></dialog>
<script>
"use strict";
const $=id=>document.getElementById(id);
let state={routes:[],drivers:[],today:[],stats:[],routeStats:[],todayDate:""};
let tab="today",busy=false,editing=null,historyRows=[],historyLoaded=false;
let histFrom="",histTo="",routeFilter="",driverFilter="",statRoute="A",historyFiltersOpen=false;
const apiBase="https://oikcdjnxkmgrpyedxera.supabase.co/functions/v1/dromologia/";
const safe=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const localDay=()=>new Intl.DateTimeFormat("sv-SE",{timeZone:"Europe/Athens",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date());
const dayLabel=s=>s?s.split("-").reverse().join("/"):"";
const isWorkday=s=>{const d=new Date(s+"T12:00:00Z").getUTCDay();return d!==0&&d!==6};
const clock=iso=>iso?new Intl.DateTimeFormat("el-GR",{timeZone:"Europe/Athens",hour:"2-digit",minute:"2-digit",hour12:false}).format(new Date(iso)):"—:—";
const lengthSecs=r=>r&&r.arrival_at?Math.max(0,Math.round((Date.parse(r.arrival_at)-Date.parse(r.departure_at))/1000)):null;
const duration=sec=>sec==null?"—":(Math.floor(sec/3600)>0?Math.floor(sec/3600)+"ώ ":"")+Math.floor((sec%3600)/60)+"λ";
const delta=sec=>sec==null?"—":(sec>0?"+":sec<0?"−":"±")+Math.round(Math.abs(sec)/60)+"λ";
const routeName=code=>state.routes.find(x=>x.code===code)?.name||code;
const driverName=id=>state.drivers.find(x=>x.id===id)?.name||"Άγνωστος";
const countSamples=(driver,route)=>state.stats.find(x=>x.driver_id===driver&&x.route_code===route);
const routeAvg=route=>state.routeStats.find(x=>x.route_code===route);
function toast(s,err=false){const x=$("toast");x.textContent=s;x.className="status"+(err?" error":"");clearTimeout(toast.timer);toast.timer=setTimeout(()=>x.className="status hidden",4500);}
async function request(action,body=null,params={}){const url=new URL(apiBase,location.href);url.searchParams.set("api",action);for(const [k,v] of Object.entries(params))url.searchParams.set(k,String(v));const opts={cache:"no-store"};if(body){opts.method="POST";opts.headers={"Content-Type":"application/json"};opts.body=JSON.stringify(body);}const r=await fetch(url,opts);let data;try{data=await r.json()}catch{throw Error("Δεν ήταν δυνατή η επικοινωνία με τον διακομιστή.");}if(!r.ok||data.error)throw Error(data.error||"Σφάλμα διακομιστή");return data;}
async function refresh(show=true){if(busy&&show)return;try{const result=await request("state");state=result;if(tab==="today"||tab==="stats"||tab==="drivers")render();if(show)toast("Τα δεδομένα ενημερώθηκαν.");}catch(e){toast(e.message,true);if(!state.routes.length)$("main").innerHTML='<div class="empty">Αδυναμία σύνδεσης. Έλεγξε το Internet και πάτησε επανάληψη.<div class="action-row"><button class="btn" data-do="refresh">Επανάληψη</button></div></div>';}}
async function doAction(action,body){if(busy)return;busy=true;document.querySelectorAll("button").forEach(b=>{if(b.dataset.do)b.disabled=true});try{await request(action,body);await refresh(false);if(tab==="history")await loadHistory();toast(action==="start"?"Η αναχώρηση καταχωρίστηκε.":action==="arrive"?"Η άφιξη καταχωρίστηκε.":"Η καταχώριση αποθηκεύτηκε και συγχρονίστηκε.");return true}catch(e){toast(e.message,true);return false}finally{busy=false;render();}}
function render(){document.querySelectorAll("[data-tab]").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));if(tab==="today")renderToday();else if(tab==="history")renderHistory();else if(tab==="stats")renderStats();else renderDrivers();}
function renderToday(){
 const done=state.today.filter(r=>!!r.arrival_at).length,open=state.today.filter(r=>!r.arrival_at).length;
 const day=state.todayDate||localDay(),work=isWorkday(day);
 let s='<h2>Σήμερα</h2><p class="meta">'+dayLabel(day)+' · '+open+' στον δρόμο · '+done+' ολοκληρώθηκαν</p>';
 if(!work)s+='<p class="empty">Σαββατοκύριακο — δεν υπάρχουν προγραμματισμένες αναχωρήσεις.</p>';
 s+='<div class="route-grid">';
 for(const r of state.routes){
  const rec=state.today.find(x=>x.route_code===r.code),status=rec?(rec.arrival_at?"done":"active"):"wait";
  const label=rec?(rec.arrival_at?"Ολοκληρώθηκε":"Στον δρόμο"):"Αναμονή";
  s+='<section class="card route-card is-'+status+'"><div class="route-top"><h3>'+safe(r.name)+'</h3><span class="tag '+status+'">'+label+'</span></div>';
  if(!rec){
   const drivers=state.drivers.filter(d=>d.is_active);
   s+='<p class="driver-instruction">Αναχώρηση · πάτησε τον οδηγό</p>';
   if(drivers.length){
    s+='<div class="driver-grid" role="group" aria-label="Επιλογή οδηγού για άμεση αναχώρηση στο '+safe(r.name)+'">'+drivers.map(d=>'<button type="button" class="driver-choice" data-do="start-driver" data-route="'+safe(r.code)+'" data-driver="'+safe(d.id)+'" aria-label="Αναχώρηση '+safe(r.name)+' με οδηγό '+safe(d.name)+'" '+(!work?"disabled":"")+'>'+safe(d.name)+'</button>').join("")+'</div>';
   }else{
    s+='<p class="route-hint">Δεν υπάρχουν ενεργοί οδηγοί. Πρόσθεσε οδηγό από την καρτέλα «Οδηγοί».</p>';
   }
   s+='<div class="route-buttons"><button class="btn secondary" disabled>Άφιξη</button></div>';
  }else{
   s+='<p class="driver-name">'+safe(driverName(rec.driver_id))+'</p>';
   if(!rec.arrival_at){
    s+='<p class="trip-line"><span>Αναχώρηση <b>'+clock(rec.departure_at)+'</b></span><span>Εκτίμηση <b>'+(rec.estimated_return_at?clock(rec.estimated_return_at):"—")+'</b></span></p>';
   }else{
    s+='<p class="trip-line"><span>'+clock(rec.departure_at)+' → '+clock(rec.arrival_at)+'</span><strong>'+duration(lengthSecs(rec))+'</strong></p>';
   }
   s+='<div class="route-buttons"><button class="btn secondary" disabled>Αναχώρηση ✓</button>';
   s+=rec.arrival_at?'<button class="btn secondary" disabled>Άφιξη ✓</button>':'<button class="btn" data-do="arrive" data-id="'+safe(rec.id)+'">Άφιξη</button>';
   s+='</div><div class="action-row"><button class="mini-btn" data-do="edit" data-id="'+safe(rec.id)+'">Διόρθωση / Διαγραφή</button></div>';
  }
  s+='</section>';
 }
 $("main").innerHTML=s+'</div>';
}
function renderStats(){const r=statRoute||"A";const base=routeAvg(r);const d=state.stats.filter(x=>x.route_code===r).sort((a,b)=>a.avg_seconds-b.avg_seconds);
let s='<h2>Στατιστικά οδηγών</h2><p class="meta">Σύγκριση μόνο στο ίδιο δρομολόγιο</p><div class="toolbar"><label class="field">Δρομολόγιο<select id="statRoute">'+state.routes.map(x=>'<option value="'+safe(x.code)+'" '+(x.code===r?'selected':'')+'>'+safe(x.name)+'</option>').join("")+'</select></label></div>';
if(!base){s+='<div class="empty">Δεν υπάρχουν ακόμη ολοκληρωμένες διαδρομές για σύγκριση.</div>';}else{
s+='<div class="card summary">Μέσος χρόνος δρομολογίου<br><strong>'+duration(base.avg_seconds)+'</strong><div class="sub">'+base.trips+' ολοκληρωμένες καταγραφές</div></div><section class="card"><div style="overflow-x:auto"><table class="stats-table"><thead><tr><th>Οδηγός</th><th>Τελευταία</th><th>Μ.Ο.</th><th>Διαφορά</th><th>Φορές</th></tr></thead><tbody>';
for(const row of d){const dif=row.avg_seconds-base.avg_seconds;s+='<tr><td>'+safe(driverName(row.driver_id))+'</td><td>'+duration(row.last_seconds)+'</td><td><b>'+duration(row.avg_seconds)+'</b></td><td class="'+(dif<=0?'good':'late')+'">'+delta(dif)+'</td><td>'+row.trips+'</td></tr>';}
s+='</tbody></table></div></section><p class="note" style="text-align:center">Η διαφορά συγκρίνει τον μέσο χρόνο κάθε οδηγού με τον μέσο χρόνο όλων των καταγραφών του ίδιου δρομολογίου. Η κίνηση, οι στάσεις και οι συνθήκες επηρεάζουν τις διάρκειες.</p>';
}
$("main").innerHTML=s;}
function renderHistory(){
 let s='<h2>Ιστορικό</h2><p class="meta">'+dayLabel(histFrom)+' – '+dayLabel(histTo)+'</p>';
 s+='<div class="action-row history-tools"><button class="btn secondary" data-do="toggle-filters" aria-expanded="'+historyFiltersOpen+'">'+(historyFiltersOpen?"Κλείσιμο φίλτρων":"Φίλτρα · Εξαγωγή CSV")+'</button></div>';
 if(historyFiltersOpen){
  s+='<div class="toolbar"><label class="field">Από<input type="date" id="histFrom" value="'+safe(histFrom)+'"></label><label class="field">Έως<input type="date" id="histTo" value="'+safe(histTo)+'"></label><label class="field">Δρομολόγιο<select id="histRoute"><option value="">Όλα</option>'+state.routes.map(r=>'<option value="'+safe(r.code)+'" '+(routeFilter===r.code?"selected":"")+'>'+safe(r.name)+'</option>').join("")+'</select></label><label class="field">Οδηγός<select id="histDriver"><option value="">Όλοι</option>'+state.drivers.map(d=>'<option value="'+safe(d.id)+'" '+(driverFilter===d.id?"selected":"")+'>'+safe(d.name)+'</option>').join("")+'</select></label><button class="btn" data-do="history-load">Αναζήτηση</button><button class="btn secondary" data-do="export">CSV</button></div>';
 }
 const f=historyRows.filter(x=>(!routeFilter||x.route_code===routeFilter)&&(!driverFilter||x.driver_id===driverFilter));
 let out=s+'<p class="meta">'+(historyLoaded?f.length+' καταχωρίσεις':'Φόρτωση ιστορικού…')+'</p><div class="stack history-list">';
 for(const rec of f){
  out+='<section class="card history-card"><div class="row"><strong>'+safe(routeName(rec.route_code))+'</strong><span class="tag '+(rec.arrival_at?"done":"active")+'">'+(rec.arrival_at?"Ολοκληρώθηκε":"Στον δρόμο")+'</span></div>';
  out+='<div class="sub">'+dayLabel(rec.service_date)+' · '+safe(driverName(rec.driver_id))+'</div><div class="row"><span>'+clock(rec.departure_at)+' → '+clock(rec.arrival_at)+'</span><span class="duration">'+duration(lengthSecs(rec))+'</span></div>';
  out+='<div class="action-row">'+(rec.arrival_at?'':'<button class="btn" data-do="arrive" data-id="'+safe(rec.id)+'">Άφιξη</button>')+'<button class="mini-btn" data-do="edit" data-id="'+safe(rec.id)+'">Διόρθωση / Διαγραφή</button></div></section>';
 }
 out+='</div>';
 if(historyLoaded&&!f.length)out+='<div class="empty">Δεν βρέθηκαν καταχωρίσεις.</div>';
 $("main").innerHTML=out;
}
function renderDrivers(){let s='<h2>Διαχείριση οδηγών</h2><div class="action-row" style="margin-bottom:18px"><button class="btn" data-do="driver-add">+ Νέος οδηγός</button></div><div class="card"><p class="sub" style="text-align:center">Οι παλιοί οδηγοί απενεργοποιούνται, αλλά διατηρούνται στο ιστορικό.</p>';
for(const d of state.drivers){s+='<div class="settings-person"><div class="identity"><strong>'+safe(d.name)+'</strong><div class="sub">'+(d.is_active?"Ενεργός":"Ανενεργός")+'</div></div><div class="actions"><button class="mini-btn" data-do="driver-rename" data-id="'+safe(d.id)+'">Όνομα</button><button class="mini-btn" data-do="driver-toggle" data-id="'+safe(d.id)+'">'+(d.is_active?"Απενεργοποίηση":"Ενεργοποίηση")+'</button></div></div>';}
$("main").innerHTML=s+'</div>';}
async function loadHistory(){try{historyLoaded=false;renderHistory();historyRows=await getAllHistory(false);historyLoaded=true;renderHistory();}catch(e){historyLoaded=true;toast(e.message,true);renderHistory();}}
async function getAllHistory(forExport){let rows=[],offset=0;while(true){const batch=await request("history",null,{from:histFrom,to:histTo,offset,limit:500});rows=rows.concat(batch.rows);if(batch.rows.length<500)break;offset+=500;if(offset>25000)throw Error("Πολύ μεγάλο εύρος. Επίλεξε μικρότερο διάστημα.");}return rows;}
function toAthensLocal(iso){if(!iso)return "";const p=new Intl.DateTimeFormat("sv-SE",{timeZone:"Europe/Athens",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hour12:false}).format(new Date(iso));return p.replace(" ","T");}
function toUTC(local){if(!local)return null;const target=Date.parse(local+":00Z");if(!Number.isFinite(target))throw Error("Μη έγκυρη ημερομηνία.");let t=target;for(let i=0;i<4;i++){const p=toAthensLocal(new Date(t).toISOString());const actual=Date.parse(p+":00Z");t+=target-actual;}return new Date(t).toISOString();}
function editRun(id){editing=state.today.find(x=>x.id===id)||historyRows.find(x=>x.id===id);if(!editing)return toast("Δεν βρέθηκε το δρομολόγιο.",true);$("editDriver").innerHTML=state.drivers.map(d=>'<option value="'+safe(d.id)+'">'+safe(d.name)+'</option>').join("");$("editDriver").value=editing.driver_id;$("editStart").value=toAthensLocal(editing.departure_at);$("editEnd").value=toAthensLocal(editing.arrival_at);$("editReason").value="";$("editDialog").showModal();}
async function exportCsv(){const rows=await getAllHistory(true);const picked=rows.filter(x=>(!routeFilter||x.route_code===routeFilter)&&(!driverFilter||x.driver_id===driverFilter));const quote=s=>'"'+String(s??"").replace(/"/g,'""')+'"';const csv=[["Ημερομηνία","Δρομολόγιο","Οδηγός","Αναχώρηση","Άφιξη","Διάρκεια (λεπτά)","Εκτίμηση επιστροφής"].map(quote).join(";")];for(const r of picked)csv.push([r.service_date,routeName(r.route_code),driverName(r.driver_id),clock(r.departure_at),clock(r.arrival_at),lengthSecs(r)==null?"":Math.round(lengthSecs(r)/60),clock(r.estimated_return_at)].map(quote).join(";"));const blob=new Blob(["\uFEFF"+csv.join("\r\n")],{type:"text/csv;charset=utf-8"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="dromologia_"+histFrom+"_"+histTo+".csv";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000);toast("Εξαγωγή "+picked.length+" καταχωρίσεων.");}
document.addEventListener("change",e=>{if(e.target.id==="statRoute"){statRoute=e.target.value;renderStats();}if(e.target.id==="histFrom")histFrom=e.target.value;if(e.target.id==="histTo")histTo=e.target.value;if(e.target.id==="histRoute"){routeFilter=e.target.value;renderHistory();}if(e.target.id==="histDriver"){driverFilter=e.target.value;renderHistory();}});
document.addEventListener("click",async e=>{const nav=e.target.closest("[data-tab]");if(nav){tab=nav.dataset.tab;render();if(tab==="history")loadHistory();$("scroll").scrollTo({top:0,behavior:"smooth"});return;}const b=e.target.closest("[data-do]");if(!b||busy)return;const act=b.dataset.do,id=b.dataset.id;if(act==="refresh"){refresh();return;}if(act==="start-driver"){const route=b.dataset.route,driver=b.dataset.driver;if(!state.routes.some(r=>r.code===route)||!state.drivers.some(d=>d.id===driver&&d.is_active)||state.today.some(r=>r.route_code===route))return toast("Το δρομολόγιο δεν είναι διαθέσιμο για αναχώρηση.",true);await doAction("start",{p_route:route,p_driver:driver});return;}if(act==="arrive"){if(!confirm("Να καταγραφεί τώρα η άφιξη;"))return;await doAction("arrive",{p_run:id});return;}if(act==="edit"){editRun(id);return;}if(act==="close-edit"){$("editDialog").close();return;}
if(act==="save-edit"){const reason=$("editReason").value.trim();if(reason.length<4)return toast("Συμπλήρωσε αιτιολογία (4 χαρακτήρες).",true);try{const p_departure=toUTC($("editStart").value),p_arrival=toUTC($("editEnd").value);if(!p_departure)throw Error("Συμπλήρωσε την αναχώρηση.");const ok=await doAction("correct",{p_run:editing.id,p_driver:$("editDriver").value,p_departure,p_arrival,p_reason:reason});if(ok){$("editDialog").close();if(tab==="history")await loadHistory();}}catch(err){toast(err.message,true);}return;}
if(act==="remove-run"){const reason=$("editReason").value.trim();if(reason.length<4)return toast("Συμπλήρωσε αιτιολογία διαγραφής.",true);if(!confirm("Να διαγραφεί η καταχώριση; Η ενέργεια καταγράφεται στο ιστορικό αλλαγών."))return;const ok=await doAction("remove",{p_run:editing.id,p_reason:reason});if(ok)$("editDialog").close();return;}
if(act==="toggle-filters"){historyFiltersOpen=!historyFiltersOpen;renderHistory();return;}
 if(act==="history-load"){if(histFrom>histTo)return toast("Η ημερομηνία Από πρέπει να προηγείται της Έως.",true);loadHistory();return;}
if(act==="export"){try{await exportCsv()}catch(err){toast(err.message,true)}return;}
if(act==="driver-add"){const name=prompt("Όνομα νέου οδηγού:");if(name===null)return;await doAction("driver",{p_id:null,p_name:name,p_active:true});return;}
if(act==="driver-rename"){const d=state.drivers.find(x=>x.id===id);if(!d)return;const name=prompt("Νέο όνομα οδηγού:",d.name);if(name===null)return;await doAction("driver",{p_id:id,p_name:name,p_active:d.is_active});return;}
if(act==="driver-toggle"){const d=state.drivers.find(x=>x.id===id);if(!d||!confirm((d.is_active?"Να απενεργοποιηθεί ":"Να ενεργοποιηθεί ")+d.name+";"))return;await doAction("driver",{p_id:id,p_name:d.name,p_active:!d.is_active});return;}
});
(function init(){const now=localDay();histTo=now;const t=new Date(now+"T12:00:00Z");t.setUTCDate(1);histFrom=t.toISOString().slice(0,10);refresh(false);setInterval(()=>{if(document.visibilityState==="visible"&&!$("editDialog").open&&tab==="today")refresh(false)},30000);if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("./sw.js",{scope:"./"}).catch(()=>{});})();
</script></body></html>
