name: Publish DOULEIA to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare static site
        run: |
          mkdir -p _site
          cp index.html manifest.webmanifest icon.svg sw.js push.js .nojekyll hero-banner.webp hero-banner.svg _site/
          test -s _site/hero-banner.webp
          test -s _site/hero-banner.svg
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site
      - name: Allow Pages artifact metadata to become available
        run: sleep 8
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
